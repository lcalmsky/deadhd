<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PROGRESS_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu:wght@700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Gothic+A1:wght@400;700;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Hahmlet:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" rel="stylesheet">
<style>
@property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

__THEME_CSS__

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body), -apple-system, "Apple SD Gothic Neo", sans-serif;
  word-break: keep-all;
  overflow-wrap: anywhere;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}
.mono { font-family: var(--f-mono); font-size: .92em; }

/* ---------- 스타 버튼 ---------- */
.star-btn {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 8px; border-radius: 999px;
  color: var(--ink-3); text-decoration: none; font-size: 11.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1;
  background: transparent; border: 1px solid var(--card-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: color .25s, border-color .25s;
}
.star-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--now) 40%, transparent); }
.star-btn:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
.star-btn .swap { position: relative; width: 13px; height: 13px; display: inline-grid; place-items: center; }
.star-btn .swap > svg { position: absolute; transition: opacity .25s, transform .5s cubic-bezier(.3,1.6,.5,1); }
.star-btn .gh { width: 12px; height: 12px; fill: currentColor; }
.star-btn .s {
  width: 13px; height: 13px; fill: var(--now); stroke: var(--now); stroke-width: 1.7; stroke-linejoin: round;
  opacity: 0; transform: rotate(-72deg) scale(.4);
}
.star-btn:hover .gh, .star-btn:focus-visible .gh { opacity: 0; transform: scale(.4); }
.star-btn:hover .s, .star-btn:focus-visible .s { opacity: 1; transform: rotate(0) scale(1.12); }

/* ---------- 허브 버튼 ---------- */
.hub-btn {
  margin-left: auto;
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px;
  color: var(--ink-3); text-decoration: none; font-size: 11.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1;
  border: 1px solid var(--card-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: color .25s, border-color .25s;
}
.hub-btn:hover { color: var(--ink); border-color: color-mix(in srgb, var(--now) 40%, transparent); }
.hub-btn:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
.hub-btn:not([hidden]) + .star-btn { margin-left: 6px; }

/* ---------- 배경 ---------- */
.aurora, .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .8s; }
.aurora i {
  position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
  filter: blur(80px);
}
.aurora i:nth-child(1) { background: var(--glow-a); top: -25vmax; left: -15vmax; }
.aurora i:nth-child(2) { background: var(--glow-b); top: 10vmax; right: -25vmax; }
.aurora i:nth-child(3) { background: var(--glow-c); bottom: -30vmax; left: 20vmax; }
.stars b {
  position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff;
  opacity: .5;
}
[data-fx="max"] .aurora { opacity: 1; }
[data-fx="max"] .stars { opacity: 1; }

/* ---------- 레이아웃 ---------- */
main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 40px 16px 80px; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; color: var(--now);
  padding: 4px 12px 4px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--now) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--now) 30%, transparent);
}
.eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--now); box-shadow: 0 0 0 0 var(--now); }

h1 {
  font-size: clamp(26px, 4.2vw, 40px); line-height: 1.3; font-weight: 900; letter-spacing: -.02em;
  margin: 16px 0 12px;
  font-family: var(--f-head); font-weight: var(--head-w); letter-spacing: var(--head-ls);
}
h1 .key { color: var(--done); }
h1 .key a { color: inherit; text-decoration: none; }
[data-fx="max"] h1 .shine {
  background: linear-gradient(100deg, var(--ink) 40%, #fff 50%, var(--ink) 60%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.goal {
  display: grid; grid-template-columns: max-content 1fr; column-gap: 12px; row-gap: 6px;
  margin: 4px 0 16px; padding: 2px 0 2px 16px;
  border-left: 3px solid;
  border-image: linear-gradient(var(--done), var(--side)) 1;
}
.goal-row { display: contents; }
.goal-row p { margin: 0; font-size: 16px; color: var(--ink-2); line-height: 1.6; }
.goal-tag {
  align-self: start; margin-top: 3px; text-align: center;
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  color: var(--done); background: color-mix(in srgb, var(--done) 14%, transparent);
  white-space: nowrap;
}
.goal-tag.end { color: var(--side); background: color-mix(in srgb, var(--side) 14%, transparent); }

.meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ink-3); font-size: 14px; }
.meta .chip {
  padding: 2px 10px; border-radius: 6px; background: var(--track); color: var(--ink-2);
}

/* ---------- 진행 바 ---------- */
.progress { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; margin: 32px 0 12px; }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--track); overflow: visible; }
.bar .fill {
  position: absolute; inset: 0 auto 0 0; width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--done-deep), var(--done-2));
  overflow: hidden;
}
.bar .tip {
  position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border-radius: 50%; background: var(--tip);
  box-shadow: 0 0 12px 4px color-mix(in srgb, var(--done-2) 70%, transparent);
  opacity: 0;
}
[data-fx="max"] .bar .tip { opacity: 1; }
.count-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.count { font-size: 15px; color: var(--ink-3); white-space: nowrap; }
.eta { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.eta b { font-family: var(--f-mono); font-size: 15px; font-weight: 600; color: var(--ink); }
.eta.past { opacity: .6; }
.eta .raw { opacity: .6; margin-right: 6px; font-weight: 400; }
.cal-note { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.count b {
  font-family: var(--f-mono); font-size: 34px; font-weight: 600; color: var(--ink);
  letter-spacing: -.03em;
}
[data-fx="max"] .count b {
  background: linear-gradient(135deg, var(--done-2), var(--count-end));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.tally { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.tally span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tally i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tally i.done { background: var(--done); } .tally i.now { background: var(--now); } .tally i.blocked { background: var(--blocked); }
.tally i.side { background: var(--side); } .tally i.left { background: var(--left); }

/* ---------- 흐름 ---------- */
.flow {
  margin: 36px 0 48px; padding: 20px 16px;
  border-radius: 20px; background: var(--card); border: 1px solid var(--card-line);
  backdrop-filter: blur(16px);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: var(--scroll) transparent;
}
.flow::-webkit-scrollbar { height: 8px; }
.flow::-webkit-scrollbar-track { background: transparent; margin: 0 16px; }
.flow::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 999px; }
.flow::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
.canvas { position: relative; margin: 0 auto; }
.lane-band {
  position: absolute; left: 0; right: 0; border-radius: 14px;
  background: color-mix(in srgb, var(--track) 55%, transparent);
  border: 1px dashed var(--card-line);
}
.lane-band { transition: border-color .4s, box-shadow .4s; }
[data-fx="max"] .lane-band.live {
  border: 1px solid color-mix(in srgb, var(--now) 35%, transparent);
  background:
    linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--now) 16%, transparent) 45%, transparent 70%),
    color-mix(in srgb, var(--track) 55%, transparent);
  background-size: 250% 100%, auto;
  box-shadow: inset 0 0 36px -12px color-mix(in srgb, var(--now) 45%, transparent);
  animation: nebula 6s ease-in-out infinite;
}
[data-fx="max"] .lane-band.done { border-color: color-mix(in srgb, var(--done) 28%, transparent); }
[data-fx="max"] .lane-band.blocked {
  border: 1px solid color-mix(in srgb, var(--blocked) 40%, transparent);
  background:
    linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--blocked) 14%, transparent) 45%, transparent 70%),
    color-mix(in srgb, var(--track) 55%, transparent);
  background-size: 250% 100%, auto;
  box-shadow: inset 0 0 36px -12px color-mix(in srgb, var(--blocked) 45%, transparent);
  animation: nebula 6s ease-in-out infinite;
}
@keyframes nebula { 0%, 100% { background-position: 100% 0, 0 0; } 50% { background-position: 0% 0, 0 0; } }
.lane-label {
  position: absolute; left: 12px; top: 10px; z-index: 2;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; line-height: 1.5;
  color: var(--ink-2); background: color-mix(in srgb, var(--track) 80%, var(--bg-2));
}
.lane-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--left); }
.lane-band.live .lane-label { color: var(--now); background: color-mix(in srgb, var(--now) 14%, var(--bg-2)); }
.lane-band.live .lane-label::before { background: var(--now); box-shadow: 0 0 8px var(--now); }
[data-fx="max"] .lane-band.live .lane-label::before { animation: blink 1.4s ease-in-out infinite; }
.lane-band.done .lane-label { color: var(--done); background: color-mix(in srgb, var(--done) 12%, var(--bg-2)); }
.lane-band.done .lane-label::before { background: var(--done); }
.lane-band.blocked .lane-label { color: var(--blocked); background: color-mix(in srgb, var(--blocked) 14%, var(--bg-2)); }
.lane-band.blocked .lane-label::before { background: var(--blocked); }
.lane-band.live .lane-label::after { content: "· 진행 중"; font-weight: 500; opacity: .85; }
.lane-band.done .lane-label::after { content: "· 완료"; font-weight: 500; opacity: .85; }
.lane-band.blocked .lane-label::after { content: "· 막힘"; font-weight: 500; opacity: .85; }
html:lang(en) .lane-band.live .lane-label::after { content: "· In progress"; }
html:lang(en) .lane-band.done .lane-label::after { content: "· Done"; }
html:lang(en) .lane-band.blocked .lane-label::after { content: "· Blocked"; }
@keyframes blink { 50% { opacity: .35; } }
.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--track); stroke-width: 3; stroke-linecap: round; }
.edge.done { stroke: var(--done); }
.edge.active { stroke: var(--now); stroke-dasharray: 2 7; }
.edge.side { stroke: var(--side); stroke-dasharray: 2 7; opacity: .8; }
.edge.blocked { stroke: var(--blocked); stroke-dasharray: 2 7; }
.edge.left { stroke: color-mix(in srgb, var(--ink-3) 55%, transparent); stroke-width: 2.5; stroke-dasharray: .1 9; }
.edge-flow { fill: none; stroke: var(--tip); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 44; opacity: 0; }
[data-fx="max"] .edge-flow {
  opacity: .9; animation: flow 1.8s linear infinite;
  filter: drop-shadow(0 0 4px var(--done-2));
}
[data-fx="max"] .edge.active, [data-fx="max"] .edge.blocked { animation: march .9s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -50; } }
@keyframes march { to { stroke-dashoffset: -9; } }
[data-fx="max"] .edge.active { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--now) 80%, transparent)); }
[data-fx="max"] .edge.done { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--done) 80%, transparent)); }
.fnode {
  position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
  transform: translate(-50%, -26px); z-index: 1;
}

.node {
  position: relative; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; font-size: 20px; font-weight: 700;
  border: 3px solid var(--left); color: var(--left); background: var(--bg-2);
  z-index: 1;
}
.fnode.done .node {
  background: linear-gradient(135deg, var(--done-deep), var(--done-2)); border-color: transparent; color: #fff;
}
[data-fx="max"] .fnode.done .node {
  box-shadow: 0 0 18px color-mix(in srgb, var(--done) 55%, transparent);
}
.fnode.now .node {
  background: linear-gradient(135deg, var(--now-deep), var(--now-2)); border-color: transparent; color: #fff;
  animation: heartbeat 1.5s ease-in-out infinite;
}
.fnode.now .node::before, .fnode.now .node::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid var(--now); animation: ripple 1.5s ease-out infinite;
}
.fnode.now .node::after { animation-delay: .75s; }
[data-fx="max"] .fnode.now .node { box-shadow: 0 0 30px 6px color-mix(in srgb, var(--now) 55%, transparent); }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.14); }
  28% { transform: scale(1); }
  42% { transform: scale(1.09); }
  56% { transform: scale(1); }
}
@keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(2); opacity: 0; } }
.fnode.side .node { border-color: var(--side); color: var(--side); box-shadow: 0 0 12px color-mix(in srgb, var(--side) 35%, transparent); }
.fnode.blocked .node {
  background: linear-gradient(135deg, var(--blocked-deep), var(--blocked-2)); border-color: transparent; color: #fff;
  box-shadow: 0 0 24px 4px color-mix(in srgb, var(--blocked) 45%, transparent);
}

.fnode .label { font-size: 14px; line-height: 1.35; font-weight: 700; }
.fnode .sub { font-size: 12px; color: var(--ink-3); }
.fnode.now .sub { color: var(--now); font-weight: 500; }
.fnode.side .sub { color: var(--side); }
.fnode.blocked .sub { color: var(--blocked); font-weight: 500; }
.fnode.left .node { border: 2px dashed color-mix(in srgb, var(--ink-3) 70%, transparent); background: color-mix(in srgb, var(--bg-2) 70%, transparent); color: var(--ink-3); }
.fnode.left .label { color: var(--ink-2); }
.fnode .when { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.fnode .when-now { color: var(--now); }
.fnode .when-past { color: var(--blocked); }

.node .orbit {
  position: absolute; inset: -11px; border-radius: 50%; pointer-events: none;
  border: 2px dashed color-mix(in srgb, var(--now) 70%, transparent);
  opacity: 0;
}
[data-fx="max"] .node .orbit { opacity: 1; animation: spin 7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
[data-fx="max"] .fnode.now .label { color: var(--now-2); text-shadow: 0 0 14px color-mix(in srgb, var(--now) 60%, transparent); }

.fnode.done .node { overflow: hidden; }
.fnode.done .node::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
  background-size: 300% 100%; background-position: 150% 0; opacity: 0;
}
[data-fx="max"] .fnode.done .node::after { opacity: 1; animation: sheen 4.5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .35s); }
@keyframes sheen { 0%, 60% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

/* ---------- 스파클 ---------- */
.spark {
  position: absolute; width: 10px; height: 10px; pointer-events: none; z-index: 3;
  background: radial-gradient(circle, #fff 0 20%, transparent 60%);
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
  animation: sparkle 1.2s ease-out forwards;
}
@keyframes sparkle {
  0% { transform: scale(0) rotate(0); opacity: 0; }
  30% { transform: scale(1.4) rotate(45deg); opacity: 1; }
  100% { transform: scale(0) rotate(120deg); opacity: 0; }
}
.burst {
  position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 4;
  animation: burst 1s cubic-bezier(.1,.8,.3,1) forwards;
}
@keyframes burst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
}

/* ---------- 섹션 ---------- */
h2 { font-size: 20px; font-weight: 700; margin: 40px 0 16px; display: flex; align-items: center; gap: 10px; }
h2 .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; }
h2.done .ic { background: color-mix(in srgb, var(--done) 18%, transparent); color: var(--done); }
h2.now .ic { background: color-mix(in srgb, var(--now) 18%, transparent); color: var(--now); }
h2.left .ic { background: var(--track); color: var(--ink-3); }
h2.blocked .ic { background: color-mix(in srgb, var(--blocked) 18%, transparent); color: var(--blocked); }

.card {
  position: relative; padding: 20px 22px; margin-bottom: 12px;
  border-radius: 16px; background: var(--card); border: 1px solid var(--card-line);
  backdrop-filter: blur(16px);
  transition: transform .25s, box-shadow .25s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card p { margin: 0; color: var(--ink-2); font-size: 15px; }
.card .ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.card .ev span {
  font-size: 12px; padding: 3px 9px; border-radius: 6px;
  background: var(--track); color: var(--ink-3);
  display: inline-flex; align-items: center;
}
.card .ev .mono { font-size: 11.5px; }
.card .ev a { color: inherit; text-decoration: none; }
.card .ev a span { background: var(--track); }
.card .ev a:hover span { color: var(--ink-2); }

/* 본문에 섞인 링크: 본문 색을 따르되 밑줄과 hover 색으로 링크임을 드러낸다. */
.lnk { color: inherit; text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.lnk:hover { color: var(--now); text-decoration-style: solid; }
.card.done h3::before { content: "✓"; color: var(--done); }
[data-fx="max"] .card.done h3::before { text-shadow: 0 0 10px var(--done); }
.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
.badge.side { color: var(--side); background: color-mix(in srgb, var(--side) 14%, transparent); }

.card.now { border-color: color-mix(in srgb, var(--now) 45%, transparent); }
.card.now h3::before { content: "▶"; color: var(--now); font-size: 12px; }
[data-fx="max"] .card.now {
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--bg-2), var(--bg-2)) padding-box,
    conic-gradient(from var(--angle), transparent 0 60%, var(--now) 75%, var(--now-hi) 80%, var(--now) 85%, transparent 100%) border-box;
  box-shadow: 0 0 40px -8px color-mix(in srgb, var(--now) 50%, transparent);
}

.card.left { opacity: .72; }
.card.left h3::before { content: "○"; color: var(--ink-3); }
.card.side { opacity: 1; }
.card.side h3::before { content: "◐"; color: var(--side); }

.card.blocked { border-color: color-mix(in srgb, var(--blocked) 45%, transparent); }
.card.blocked h3::before { content: "!"; color: var(--blocked); }
[data-fx="max"] .card.blocked { box-shadow: 0 0 40px -8px color-mix(in srgb, var(--blocked) 45%, transparent); }

/* ---------- 카드 안 그림 ---------- */
.ic-sm { width: 13px; height: 13px; flex: none; vertical-align: -2px; margin-right: 4px; opacity: .8; }

.substeps { display: flex; align-items: center; gap: 0; margin: 16px 0 4px; flex-wrap: wrap; row-gap: 10px; }
.sub-s { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.sub-s i {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-style: normal; font-size: 11px; font-weight: 700;
  border: 2px solid var(--left); color: var(--left);
}
.sub-s.ok { color: var(--ink-2); }
.sub-s.ok i { background: var(--done); border-color: var(--done); color: #fff; box-shadow: 0 0 10px color-mix(in srgb, var(--done) 60%, transparent); }
.sub-s.run { color: var(--now); font-weight: 700; }
.sub-s.run i { background: var(--now); border-color: var(--now); color: #fff; box-shadow: 0 0 14px color-mix(in srgb, var(--now) 70%, transparent); }
.sub-s.blocked { color: var(--blocked); font-weight: 700; }
.sub-s.blocked i { background: var(--blocked); border-color: var(--blocked); color: #fff; box-shadow: 0 0 10px color-mix(in srgb, var(--blocked) 60%, transparent); }
.sub-line { width: 28px; height: 2px; margin: 0 8px; background: var(--track); border-radius: 2px; }
.sub-line.ok { background: linear-gradient(90deg, var(--done), var(--done-2)); }
.sub-line.run { background: linear-gradient(90deg, var(--done-2), var(--now)); }

.etime { margin-top: 12px; }
.etime-row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.etime-bar {
  position: relative; height: 8px; border-radius: 999px; margin: 6px 0; overflow: hidden;
  background-color: var(--track);
  background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--now) 45%, transparent) 0 5px, transparent 5px 9px);
}
.etime-bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--now); }

.viz { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
.stat {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px 10px 10px; border-radius: 12px;
  background: color-mix(in srgb, var(--track) 70%, transparent);
}
.stat .t { font-size: 12px; color: var(--ink-3); line-height: 1.4; }
.stat .t b { display: block; font-size: 18px; color: var(--ink); font-family: var(--f-mono); letter-spacing: -.02em; }
.ring { width: 46px; height: 46px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: var(--track); }
.ring .fg { stroke: var(--done); stroke-linecap: round; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; animation: draw 1.4s .3s cubic-bezier(.2,.8,.2,1) forwards; filter: drop-shadow(0 0 4px var(--done)); }
@keyframes draw { to { stroke-dashoffset: var(--off, 0); } }
.stat .big-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
.stat .big-ic svg { width: 24px; height: 24px; }

.compare { flex: 1 1 280px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--track) 70%, transparent); }
.compare .cap { font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.cmp-row { display: grid; grid-template-columns: 88px 1fr 48px; align-items: center; gap: 10px; font-size: 12.5px; margin: 6px 0; }
.cmp-row .track { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
.cmp-row .val { height: 100%; width: 0; border-radius: inherit; animation: grow 1.2s .4s cubic-bezier(.2,.8,.2,1) forwards; }
.cmp-row.win .val { background: linear-gradient(90deg, var(--side), var(--side-hi)); box-shadow: 0 0 12px var(--side); }
.cmp-row.lose .val { background: var(--left); }
.cmp-row.risk .val { background: linear-gradient(90deg, var(--now-deep), var(--blocked)); box-shadow: 0 0 12px var(--blocked); }
.cmp-row .num { font-family: var(--f-mono); text-align: right; color: var(--ink-2); }
.cmp-row.win .num { color: var(--side); font-weight: 700; }
.cmp-row.risk .num { color: var(--blocked-2); font-weight: 700; }
@keyframes grow { to { width: var(--w); } }

/* 처음 볼 때만 입장 애니메이션을 재생한다 (새로고침 시 최종 상태로 바로 그린다) */
body.no-entrance .ring .fg { animation: none; stroke-dashoffset: var(--off, 0); }
body.no-entrance .cmp-row .val { animation: none; width: var(--w); }

footer { margin-top: 48px; color: var(--ink-3); font-size: 12px; text-align: center; }

/* ---------- 모바일 ---------- */
@media (max-width: 720px) {
  main { padding-top: 28px; }
  .progress { grid-template-columns: 1fr; gap: 8px; }
  .goal { grid-template-columns: 1fr; row-gap: 4px; }
  .goal-tag { justify-self: start; }
  .goal-row:not(:first-child) .goal-tag { margin-top: 8px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- 컴팩트 보기 ---------- */
/* 버튼 줄 폭은 main(max-width 1040px)·#compact[data-o] 와 함께 바꾼다 */
.viewbar {
  position: relative; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  max-width: 1040px; margin: 0 auto; padding: 14px 16px 0;
}
.viewbar[data-o="port"] { max-width: 520px; }
.viewbar[data-o="land"] { max-width: 1100px; }
.seg-ctl {
  display: inline-flex; padding: 2px; gap: 1px; border-radius: 999px;
  background: transparent; border: 1px solid var(--card-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.seg-ctl button {
  font: inherit; font-size: 11.5px; line-height: 1; color: var(--ink-3); background: none; border: 0; cursor: pointer;
  height: 22px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  transition: color .2s, background .2s;
}
.seg-ctl button:hover { color: var(--ink); }
.seg-ctl button[aria-pressed="true"] { color: var(--ink); background: color-mix(in srgb, var(--done) 18%, transparent); }
.seg-ctl button:focus-visible { outline: 2px solid var(--now); outline-offset: 1px; }
.seg-ctl svg { width: 12px; height: 12px; }
#orient .lbl { display: none; }
#o-land, #o-port { padding: 0 7px; }
body[data-view] main { padding-top: 24px; }
body[data-view]:not([data-view="full"]) main { display: none; }
/* 레인 보드는 컴팩트 보기에서도 보여야 하므로 main 안에서 이것만 남긴다 */
body[data-view]:not([data-view="full"])[data-board] main { display: block; padding: 0 0 16px; }
body[data-view]:not([data-view="full"])[data-board] main > *:not(#board) { display: none; }
body[data-view]:not([data-view="full"])[data-board] #board { margin: 16px; }
body:not([data-view]) #orient, body[data-view="full"] #orient { display: none; }

#compact { position: relative; z-index: 1; margin: 0 auto; padding: 16px 16px 40px; font-size: 13.5px; }
#compact[data-o="port"] { max-width: 520px; }
#compact[data-o="land"] { max-width: 1100px; }
.cx-glass { background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.cx-key { color: var(--done); font-family: var(--f-mono); font-size: 12px; text-decoration: none; }
.cx-title { font-family: var(--f-head); font-size: 18px; line-height: 1.35; margin: 4px 0 0; text-wrap: balance; }
.cx-muted { color: var(--ink-3); }
.cx-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--now);
  padding: 2px 10px 2px 8px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--now) 12%, transparent); border: 1px solid color-mix(in srgb, var(--now) 30%, transparent);
}
.cx-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--now); animation: cxpulse 1.6s ease-in-out infinite; }
@keyframes cxpulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--now) 25%, transparent); } }
.cx-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.cx-dot.done { background: var(--done); } .cx-dot.now { background: var(--now); box-shadow: 0 0 8px var(--now); }
.cx-dot.side { background: var(--side); } .cx-dot.blocked { background: var(--blocked); }
.cx-dot.left { border: 1.5px dashed var(--left); }
.cx-bar { height: 6px; border-radius: 999px; background: var(--track); position: relative; }
.cx-bar > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, var(--done-deep), var(--done-2)); box-shadow: 0 0 10px color-mix(in srgb, var(--done-2) 50%, transparent); }
.cx-count b { font-family: var(--f-mono); font-weight: 600; background: linear-gradient(135deg, var(--done-2), var(--count-end)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cx-eta { font-size: 12px; color: var(--ink-3); white-space: nowrap; } .cx-eta b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; }
.cx-card { padding: 14px 16px; min-width: 0; }
.cx-card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 400; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.cx-card p { margin: 0; color: var(--ink-2); font-size: 13px; }
.cx-subs { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.cx-subs li { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
.cx-subs .g { width: 14px; text-align: center; font-size: 11px; }
.cx-subs .done .g { color: var(--done-2); } .cx-subs .now { color: var(--ink); } .cx-subs .now .g { color: var(--now); }
.cx-subs .left { color: var(--ink-3); } .cx-subs .left .g { color: var(--left); }
.cx-ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.cx-ev a, .cx-ev span { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--track); color: var(--ink-2); text-decoration: none; }
.cx-ev a:hover { color: var(--ink); }
.cx-ev .mono { font-family: var(--f-mono); }
.cx-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
.cx-head .cx-count { text-align: right; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.cx-head .cx-count > b { font-size: 26px; display: block; line-height: 1.1; }

/* 스트립 */
.ca-strip { display: flex; align-items: flex-start; margin: 18px 0 16px; }
.ca-strip .st { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; min-width: 0; }
.ca-strip .st::before { content: ""; position: absolute; top: 7px; left: -50%; width: 100%; height: 2px; background: var(--track); z-index: -1; }
.ca-strip .st:first-child::before { display: none; }
.ca-strip .st.done::before, .ca-strip .st.now::before { background: var(--done); box-shadow: 0 0 6px var(--done); }
.ca-strip .nd { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; color: var(--bg); background: var(--bg); }
.ca-strip .done .nd { background: var(--done); }
.ca-strip .now .nd { background: var(--now); box-shadow: 0 0 0 4px color-mix(in srgb, var(--now) 25%, transparent), 0 0 14px var(--now); }
.ca-strip .left .nd { border: 1.5px dashed var(--left); }
.ca-strip .blocked .nd { background: var(--blocked); }
.ca-strip small { font-size: 10.5px; color: var(--ink-3); text-align: center; line-height: 1.25; }
.ca-strip .now small { color: var(--now-2); }
.ca-side { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: -6px 0 14px; font-size: 11.5px; color: var(--ink-3); }
.ca-side span { color: var(--side-hi); border: 1px solid color-mix(in srgb, var(--side) 40%, transparent); border-radius: 6px; padding: 1px 7px; }
.ca-body { display: grid; gap: 12px; }
#compact[data-o="land"] .ca-body { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
.ca-rest { display: grid; gap: 4px; align-content: start; }
.ca-rest details { border-top: 1px solid var(--card-line); padding: 6px 0 2px; }
#compact[data-o="land"] .ca-rest details:first-child { border-top: 0; padding-top: 0; }
.ca-rest summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 13px; }
.ca-rest summary::-webkit-details-marker { display: none; }
.ca-rest summary::after { content: "▸"; margin-left: auto; color: var(--ink-3); transition: transform .2s; }
.ca-rest details[open] summary::after { transform: rotate(90deg); }
.ca-rest ul { margin: 6px 0 4px 17px; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-3); }
.ca-rest summary:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }

/* 타임라인 */
.cb-top { display: grid; gap: 6px; margin-bottom: 14px; }
.cb-top .row { display: flex; gap: 10px; align-items: center; }
.cb-top .row .cx-bar { flex: 1; }
.cb-top .cx-count b { font-size: 15px; }
.cb-body { display: grid; gap: 14px; }
#compact[data-o="land"] .cb-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; }
#compact[data-o="land"] .cb-body .cx-card { position: sticky; top: 16px; }
.cb-tl { list-style: none; margin: 0; padding: 0; position: relative; }
.cb-tl::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--track); }
.cb-tl > li { position: relative; padding: 5px 0 5px 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; color: var(--ink-2); }
.cb-tl > li > .cx-dot { position: absolute; left: 2px; top: 11px; width: 10px; height: 10px; outline: 3px solid var(--bg); }
.cb-tl > li.done::after { content: ""; position: absolute; left: 6px; top: 16px; height: 100%; width: 2px; background: var(--done); z-index: -1; }
.cb-tl > li .tm { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.cb-tl > li.left, .cb-tl > li.side { color: var(--ink-3); }
.cb-tl > li.now { color: var(--ink); }
.cb-tl .tag { font-size: 10px; color: var(--side-hi); border: 1px solid color-mix(in srgb, var(--side) 40%, transparent); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
#compact[data-o="port"] .cb-tl > li.now { padding: 0; display: block; margin: 6px 0; }
#compact[data-o="port"] .cb-tl > li.now .cx-dot { top: 20px; }
#compact[data-o="port"] .cb-tl > li.now .cx-card { margin-left: 18px; }
#compact[data-o="land"] .cb-tl > li.now { background: color-mix(in srgb, var(--now) 10%, transparent); border-radius: 8px; }

/* 타일 */
.cc-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cc-tile { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cc-tile small { font-size: 11px; color: var(--ink-3); }
.cc-tile b { font-family: var(--f-mono); font-size: 19px; font-weight: 600; }
.cc-tile .cc-ring { display: flex; gap: 8px; align-items: center; flex: none; }
.cc-tile .cx-count { white-space: nowrap; flex: none; overflow-wrap: normal; }
.cb-top > .cx-pill { justify-self: start; }
.cc-tile svg { width: 36px; height: 36px; flex: none; }
.cc-seg { display: flex; gap: 3px; margin: 14px 0 6px; }
.cc-seg span { flex: 1; height: 9px; border-radius: 3px; background: var(--track); }
.cc-seg .done { background: var(--done); } .cc-seg .now { background: var(--now); box-shadow: 0 0 8px var(--now); }
.cc-seg .side { background: color-mix(in srgb, var(--side) 55%, transparent); } .cc-seg .left { background: transparent; border: 1px dashed var(--left); }
.cc-seg .blocked { background: var(--blocked); }
.cc-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); margin-bottom: 14px; }
.cc-legend span { display: inline-flex; gap: 5px; align-items: center; }
.cc-grid { display: grid; gap: 12px; }
#compact[data-o="land"] .cc-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: start; }
#compact[data-o="land"] .cc-tiles { grid-template-columns: 1fr; }
#compact[data-o="land"] .cc-tile { flex-direction: row; justify-content: space-between; align-items: center; }
.cc-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.cc-chips button {
  font: inherit; font-size: 12px; color: var(--ink-2); background: var(--track); border: 1px solid var(--card-line);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.cc-chips button[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--done) 45%, transparent); }
.cc-chips button:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
.cc-list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
.cc-list li { display: flex; gap: 8px; align-items: center; }
.cc-list li span:last-child { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
@media (max-width: 600px) { .seg-ctl button { padding: 0 7px; } }

/* ---------- 레인 보드 ---------- */
.board {
  margin: 36px 0 0; padding: 16px;
  border-radius: 20px; background: var(--card); border: 1px solid var(--card-line);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  --bd-stall: var(--now-deep);
}
.bd-sum { display: grid; gap: 8px; margin-bottom: 16px; }
.bd-big { font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.bd-big small { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.bd-stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--track); }
.bd-stack i { display: block; height: 100%; }
.bd-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--ink-3); }
.bd-legend span { display: inline-flex; align-items: center; gap: 5px; }
.bd-legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.bd-stack i.done, .bd-legend i.done { background: var(--done); }
.bd-stack i.now, .bd-legend i.now { background: var(--now); }
/* 정체는 진행과 색이 가까워 색만으로는 갈리지 않는다. 같은 색 사선 빗금으로 모양도 다르게 한다. */
.bd-stack i.stall, .bd-legend i.stall {
  background: repeating-linear-gradient(45deg, var(--bd-stall) 0 3px, transparent 3px 6px);
}
.bd-stack i.blocked, .bd-legend i.blocked { background: var(--blocked); }
.bd-stack i.waiting, .bd-legend i.waiting { background: var(--ink-3); opacity: .55; }
.bd-stack i.left, .bd-legend i.left { background: var(--left); }

.bd-attn { display: grid; gap: 8px; margin-bottom: 16px; }
.bd-attn-row {
  --bd-c: var(--left);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px;
  font-size: 13.5px;
  background: color-mix(in srgb, var(--bd-c) 9%, var(--card));
  border: 1px solid color-mix(in srgb, var(--bd-c) 35%, transparent);
}
.bd-attn-row.stall { --bd-c: var(--bd-stall); }
.bd-attn-row.blocked { --bd-c: var(--blocked); }
.bd-tag {
  padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  font-size: 11px; font-weight: 700; color: var(--bd-c);
  background: color-mix(in srgb, var(--bd-c) 15%, transparent);
}
.bd-why { flex: 1; min-width: 180px; color: var(--ink-2); }

.bd-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.bd-tab {
  height: 28px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--card-line);
  background: transparent; color: var(--ink-3); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.bd-tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bd-tab:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }
.bd-panel[hidden] { display: none; }

.bd-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
.bd-scroll::-webkit-scrollbar { height: 8px; }
.bd-scroll::-webkit-scrollbar-track { background: transparent; }
.bd-scroll::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 999px; }
.bd-grid { min-width: 860px; }
.bd-row {
  display: grid; align-items: center; min-height: 52px; padding: 0 6px;
  grid-template-columns: 250px repeat(var(--bd-stages, 1), minmax(58px, 1fr)) 132px;
  border-top: 1px solid var(--card-line); cursor: pointer;
}
.bd-row:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.bd-row.bd-head {
  min-height: 32px; border-top: 0; cursor: default;
  font-size: 11px; font-weight: 700; color: var(--ink-3);
}
.bd-row.bd-head:hover { background: none; }
.bd-row.bd-head .bd-st { text-align: center; }
.bd-row.bd-head .bd-sig { text-align: right; }

.bd-task { display: grid; gap: 1px; min-width: 0; padding: 6px 8px 6px 0; }
.bd-t1 { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.bd-k { font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.bd-nm { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd-t2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }
.bd-wk {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 6px; border-radius: 5px;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; background: var(--track); color: var(--ink-2);
}
.bd-wk::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--left); }
.bd-dep { font-size: 10.5px; }

.bd-cell { position: relative; height: 52px; display: grid; place-items: center; }
.bd-cell::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
  transform: translateY(-50%); background: var(--track);
}
.bd-task + .bd-cell::before { left: 50%; }
.bd-cell.done::before { background: var(--done); opacity: .55; }
.bd-dot {
  position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--left);
}
.bd-cell.pending .bd-dot { border-color: var(--track); }
.bd-cell.done .bd-dot { width: 10px; height: 10px; background: var(--done); border-color: var(--done); }
.bd-cell.now .bd-dot, .bd-cell.stall .bd-dot, .bd-cell.blocked .bd-dot { width: 22px; height: 22px; border-width: 0; }
.bd-cell.now .bd-dot { background: var(--now); box-shadow: 0 0 0 5px color-mix(in srgb, var(--now) 20%, transparent); animation: bdpulse 1.6s ease-in-out infinite; }
.bd-cell.stall .bd-dot { background: var(--bd-stall); box-shadow: 0 0 0 5px color-mix(in srgb, var(--bd-stall) 20%, transparent); }
.bd-cell.stall .bd-dot::after { content: "!"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff; }
.bd-cell.blocked .bd-dot { background: var(--blocked); box-shadow: 0 0 0 5px color-mix(in srgb, var(--blocked) 18%, transparent); }
.bd-cell.blocked .bd-dot::after { content: "■"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 8px; color: #fff; }
.bd-cell.waiting .bd-dot { width: 18px; height: 18px; border-style: dashed; border-color: var(--ink-3); }
.bd-note {
  position: absolute; bottom: 1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 9.5px; font-weight: 700; color: var(--ink-3);
}
.bd-cell.now .bd-note { color: var(--now); }
.bd-cell.stall .bd-note { color: var(--bd-stall); }
.bd-cell.blocked .bd-note { color: var(--blocked); }
.bd-cell-text { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
@keyframes bdpulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--now) 0%, transparent); } }

.bd-sig { display: grid; gap: 1px; padding-right: 4px; font-size: 11.5px; text-align: right; color: var(--ink-3); }
.bd-ago { font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.bd-ago.stall { color: var(--bd-stall); }
.bd-ago.none { font-size: 10.5px; color: var(--ink-3); }
.bd-eta { font-size: 10.5px; white-space: nowrap; }

.bd-grp {
  display: flex; align-items: center; gap: 8px; padding: 12px 6px 6px; user-select: none; cursor: pointer;
  font-size: 12px; font-weight: 800; color: var(--bd-c); border-top: 1px solid var(--card-line);
}
.bd-grp.attention { --bd-c: var(--bd-stall); }
.bd-grp.active { --bd-c: var(--now); }
.bd-grp.waiting { --bd-c: var(--ink-3); }
.bd-grp.finished { --bd-c: var(--done); }
.bd-grp .bd-car { color: var(--ink-3); transition: transform .2s; }
.bd-grp.closed .bd-car { transform: rotate(-90deg); }
.bd-grp .bd-n { font-family: var(--f-mono); font-size: 11px; font-weight: 700; color: var(--ink-3); }
.bd-grp:focus-visible { outline: 2px solid var(--now); outline-offset: -2px; }

.bd-detail { display: none; }
.bd-detail.open {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  padding: 8px 6px 16px; border-top: 1px dashed var(--card-line);
}
.bd-detail h4 { margin: 4px 0 6px; font-size: 11.5px; color: var(--ink-3); }
.bd-detail p { margin: 0; font-size: 13px; color: var(--ink-2); }
.bd-detail .ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.bd-detail .ev span {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
  font-size: 11.5px; background: var(--track); color: var(--ink-2);
}
.bd-detail .ev a { color: inherit; text-decoration: none; }
.bd-log { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); }
.bd-log li { display: grid; grid-template-columns: 46px 1fr; gap: 8px; }
.bd-log time { font-family: var(--f-mono); color: var(--ink-3); }

.bd-tl { border-top: 1px solid var(--card-line); }
.bd-tl-head { display: grid; grid-template-columns: 150px 1fr; align-items: center; min-height: 24px; }
.bd-ticks { position: relative; height: 20px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--ink-3); }
.bd-tick { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.bd-tl-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; min-height: 44px; border-top: 1px solid var(--card-line); }
.bd-tl-nm { display: grid; padding-right: 8px; font-size: 12px; font-weight: 700; }
.bd-tl-nm small { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; color: var(--ink-3); }
.bd-track { position: relative; height: 44px; }
.bd-bar {
  position: absolute; top: 9px; height: 26px; display: flex; align-items: center; padding: 0 8px;
  border-radius: 7px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; color: #fff; background: var(--left);
}
.bd-bar.done { background: var(--done); }
.bd-bar.now { background: var(--now); color: #2a1a00; }
.bd-bar.stall { background: repeating-linear-gradient(45deg, var(--bd-stall) 0 8px, color-mix(in srgb, var(--bd-stall) 70%, #000) 8px 16px); }
.bd-bar.blocked { background: var(--blocked); }
.bd-bar.blank { background: transparent; border: 1px dashed var(--left); color: var(--ink-3); }
.bd-nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--now); }
.bd-empty { font-size: 12.5px; color: var(--ink-3); padding: 10px 2px; }

.bd-recent { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--card-line); }
.bd-recent h3 { margin: 0 0 8px; font-size: 12px; font-weight: 800; color: var(--ink-3); }
.bd-feed { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
.bd-feed li { display: grid; grid-template-columns: 44px 12px 1fr; gap: 6px; align-items: baseline; }
.bd-feed time { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.bd-feed .bd-b { width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--left); }
.bd-feed .bd-b.done { background: var(--done); }
.bd-feed .bd-b.now { background: var(--now); }
.bd-feed .bd-b.stall { background: var(--bd-stall); }
.bd-feed .bd-b.blocked { background: var(--blocked); }
.bd-feed .bd-fk { font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; }

@media (max-width: 720px) {
  .bd-detail.open { grid-template-columns: 1fr; }
}

/* ---------- ink 테마 ---------- */
[data-theme="ink"] .fnode.done .node, [data-theme="ink"] .fnode.now .node { color: var(--bg); }
[data-theme="ink"] .sub-s.ok i, [data-theme="ink"] .sub-s.run i { color: var(--bg); }
[data-theme="ink"] .fnode.blocked .node {
  background: radial-gradient(circle, var(--bg) 0 58%, transparent 59%), repeating-linear-gradient(45deg, var(--ink) 0 3px, transparent 3px 7px);
  border: 3px solid var(--ink); color: var(--ink); box-shadow: none;
}
[data-theme="ink"] .sub-s.blocked i { background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 5px); color: var(--ink); border-color: var(--ink); box-shadow: none; }
[data-theme="ink"] .card.blocked {
  border: 1px solid var(--ink);
  background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--ink) 7%, transparent) 0 6px, transparent 6px 12px);
  box-shadow: none !important;
}
[data-theme="ink"] .cx-dot.blocked, [data-theme="ink"] .cc-seg .blocked, [data-theme="ink"] .ca-strip .blocked .nd, [data-theme="ink"] .tally i.blocked {
  background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 4px); border: 1px solid var(--ink);
}
[data-theme="ink"] .fnode.side .node { border-style: dashed; box-shadow: none; }
[data-theme="ink"] .cx-dot.side, [data-theme="ink"] .cc-seg .side, [data-theme="ink"] .tally i.side { background: linear-gradient(90deg, var(--side) 50%, transparent 50%); border: 1.5px solid var(--side); }
[data-theme="ink"] .tally i.left { background: transparent; border: 1.5px dashed var(--ink-3); }
[data-theme="ink"] .edge.blocked { stroke-dasharray: 8 6; }
[data-theme="ink"] .lane-band.blocked .lane-label::before { background: repeating-linear-gradient(45deg, var(--ink) 0 1.5px, transparent 1.5px 3px); }
[data-theme="ink"] body[data-fx="max"] h1 .shine { background-image: linear-gradient(100deg, var(--ink) 40%, var(--ink-3) 50%, var(--ink) 60%); }
[data-theme="ink"] .eyebrow { background: transparent; border-color: var(--ink); }
[data-theme="ink"] .goal { border-image: none; border-left-color: var(--ink); }
[data-theme="ink"] .count b { font-family: var(--f-head); font-weight: var(--head-w); letter-spacing: var(--head-ls); font-size: 40px; }
/* 레인 보드도 색 대신 채움·윤곽·빗금으로 상태를 가른다 */
[data-theme="ink"] .board { --bd-stall: var(--ink); }
[data-theme="ink"] .bd-stack i.stall, [data-theme="ink"] .bd-legend i.stall,
[data-theme="ink"] .bd-stack i.blocked, [data-theme="ink"] .bd-legend i.blocked,
[data-theme="ink"] .bd-feed .bd-b.stall, [data-theme="ink"] .bd-feed .bd-b.blocked {
  background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 4px);
  border: 1px solid var(--ink);
}
[data-theme="ink"] .bd-cell.stall .bd-dot::after, [data-theme="ink"] .bd-cell.blocked .bd-dot::after { color: var(--bg); }
[data-theme="ink"] .bd-cell.blocked .bd-dot {
  background: repeating-linear-gradient(45deg, var(--ink) 0 3px, transparent 3px 7px);
  border: 2px solid var(--ink);
}
[data-theme="ink"] .bd-attn-row {
  background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--ink) 7%, transparent) 0 6px, transparent 6px 12px);
  border-color: var(--ink);
}
[data-theme="ink"] .bd-bar { color: var(--bg); }
[data-theme="ink"] .bd-bar.blocked {
  background: repeating-linear-gradient(45deg, var(--ink) 0 4px, transparent 4px 8px);
  border: 1px solid var(--ink); color: var(--ink);
}
[data-theme="ink"] .bd-ago.stall { text-decoration: underline dotted; }

/* ---------- 입력 대기 띠 ---------- */
.status { margin: 22px 0 0; padding: 14px 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-line); backdrop-filter: blur(16px); }
.notice { position: fixed; left: 50%; bottom: 18px; z-index: 5; transform: translateX(-50%); margin: 0; padding: 8px 14px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; color: var(--blocked-2); background: var(--card); border: 1px solid color-mix(in srgb, var(--blocked) 45%, transparent); backdrop-filter: blur(16px); }
.eta-col { display: contents; }
.status-main { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.status-title { font-family: var(--f-head); font-weight: 700; font-size: 20px; line-height: 1.2; }
.status-what { font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--card-line); border-radius: 6px; color: var(--ink-2); }
.status-sub { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.status-waiting_permission { border-color: color-mix(in srgb, var(--now) 45%, transparent); box-shadow: 0 0 40px -8px color-mix(in srgb, var(--now) 50%, transparent); }
.status-waiting_permission .status-dot { background: var(--now); box-shadow: 0 0 10px var(--now); animation: blink 1.2s ease-in-out infinite; }
.status-waiting_permission .status-title { color: var(--now-2); }
.status-waiting_permission .status-what { border-color: color-mix(in srgb, var(--now) 30%, transparent); background: color-mix(in srgb, var(--now) 10%, transparent); }
.status-idle { border-color: color-mix(in srgb, var(--side) 45%, transparent); }
.status-idle .status-dot { background: var(--side); }
.status-idle .status-title { color: var(--side-hi); }
.status-working { padding: 10px 18px; }
.status-working .status-title { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.status-working .status-dot { background: var(--done); box-shadow: 0 0 8px var(--done); animation: blink 1.6s ease-in-out infinite; }
.status-stall .status-dot { background: var(--blocked); animation: none; }
.status-stall .status-title { color: var(--blocked-2); }
.status-ended { opacity: .6; }
[data-theme="ink"] .status-waiting_permission { background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--ink) 7%, transparent) 0 6px, transparent 6px 12px); box-shadow: none; border-color: var(--ink); }
[data-theme="ink"] .status-waiting_permission .status-main { display: inline-flex; padding: 4px 10px; margin-left: -10px; border-radius: 8px; background: var(--bg); }
</style>

      liveWait: d => 'Waiting for permission · ' + d,

      calFast: (f, n) => 'Estimates run ' + f + '× fast · from ' + n + ' done steps',
      boardTitle: 'Lane board',

      boardDone: 'done',
      boardRunning: 'running',

      boardTabTime: 'Worker × time',
