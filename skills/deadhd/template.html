      boardUnassigned: 'Unassigned',
      boardDepends: s => '↳ waiting on ' + s,
      boardSignalNone: 'No signal recorded',
      boardEtaLeft: d => 'about ' + d + ' left',
      boardGroupAttention: 'Needs attention',
      boardGroupActive: 'In progress',
      boardGroupWaiting: 'Waiting · left',
      boardGroupFinished: 'Done',
      boardDetailNow: 'Now',
      boardLogTitle: 'Lane log',
      boardNoLog: 'No record',
      boardRecent: 'Recent transitions',
      boardNoTime: 'No lane has a start time'
    }
  };

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  };
  const iconEl = (name, cls) => {
    const svg = document.createElementNS(NS, 'svg');
    if (cls) svg.setAttribute('class', cls);
    const use = document.createElementNS(NS, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  };
  // http(s) 밖의 스킴은 링크로 만들지 않고 텍스트로만 그린다.
  const httpHref = href => (typeof href === 'string' && /^https?:\/\//i.test(href)) ? href : null;
  const linkEl = (href, node, cls) => {
    const safe = httpHref(href);
    if (!safe) return node;
    const a = document.createElement('a');
    if (cls) a.className = cls;
    a.href = safe; a.target = '_blank'; a.rel = 'noopener';
    a.appendChild(node);
    return a;
  };

  const toDate = v => (v instanceof Date ? v : new Date(v));
  const pad2 = n => String(n).padStart(2, '0');
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  // 표기는 보는 시점의 브라우저 로컬 날짜를 기준으로 정한다 (렌더 시점이 아니다).
  function fmtClock(target, viewNow) {
    const t = toDate(target), v = toDate(viewNow);
    const hm = pad2(t.getHours()) + ':' + pad2(t.getMinutes());
    if (sameDay(t, v)) return hm;
    if (sameDay(t, new Date(v.getFullYear(), v.getMonth(), v.getDate() + 1))) return L.tomorrow + hm;
    return L.date(t.getMonth() + 1, pad2(t.getDate()), hm);
  }

  function fmtDur(minutes) {
    const m = Math.round(Number(minutes) || 0);
    if (m < 60) return L.min(m);
    if (m < 1440) {
      const h = Math.floor(m / 60), rest = m % 60;
      return rest ? L.hourMin(h, rest) : L.hour(h);
    }
    const h = Math.round(m / 60), d = Math.floor(h / 24), rest = h % 24;
    return rest ? L.dayHour(d, rest) : L.day(d);
  }

  function linkify(text) {
    const frag = document.createDocumentFragment();
    const s = text == null ? '' : String(text);
    let last = 0, m;
    LINK_RE.lastIndex = 0;
    while ((m = LINK_RE.exec(s)) !== null) {
      const isUrl = m[2] !== undefined;
      let label = m[0];
      let end = m.index + label.length;
      if (isUrl) {
        const trimmed = label.replace(/[.,;:!?]+$/, '');
        end -= label.length - trimmed.length;
        label = trimmed;
      }
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      frag.appendChild(linkEl(isUrl ? label : LINKS[m[1]], document.createTextNode(label), 'lnk'));
      last = end;
      LINK_RE.lastIndex = end;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    return frag;
  }

  // render.py 는 script 태그가 조기에 닫히지 않게 데이터의 HTML 주석 시작 기호를 `<\!--` 로 바꿔 넣는다.
  // JSON 에서 유효한 이스케이프가 아니므로 여기서 되돌린다. 이 스크립트 안에는 그 기호를 그대로 적지 않는다.
  // 적으면 HTML 파서가 escaped 상태로 들어가 아래 정규식의 script 글자를 보고 닫는 자리를 잘못 잡는다.
  const parseData = raw => JSON.parse(String(raw).replace(/<\\!/g, '<!'));
  // 태그 글자를 나눠 적는다. 이어 적으면 HTML 파서가 스크립트 안의 태그로 읽을 수 있고, 이 파일에 데이터 태그가 둘 있는 것처럼 보인다.
  const DATA_RE = new RegExp('<scr' + 'ipt id="progress-data"[^>]*>([\\s\\S]*?)</scr' + 'ipt>');
  const CODE_RE = new RegExp('<scr' + 'ipt>([\\s\\S]*?)</scr' + 'ipt>');
  const REFRESH_MS = 15000;
  const ownCode = document.currentScript ? document.currentScript.textContent : null;
  const docLang = document.documentElement ? document.documentElement.lang : '';

  const store = {
    get(k) { try { const v = sessionStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경에서는 매번 처음 보는 것으로 취급한다 */ } }
  };
  const plusMinutes = (base, mins) => new Date(base.getTime() + mins * 60000);

  const notice = $('notice');
  const showNotice = text => { notice.textContent = text; notice.hidden = false; };
  const hideNotice = () => { notice.hidden = true; notice.textContent = ''; };

  // 바뀐 것이 없으면 DOM 을 건드리지 않는다. 같은 내용을 다시 넣으면 aria-live 띠가 또 읽고 선택과 포커스가 풀린다.
  // cloneNode 가 없는 환경(테스트 하네스)에서는 늘 다시 채운다.
  function swap(target, fill) {
    if (typeof target.cloneNode !== 'function') {
      target.textContent = '';
      fill(target);
      return true;
    }
    const next = target.cloneNode(false);
    fill(next);
    if (target.isEqualNode(next)) return false;
    Array.from(target.attributes).forEach(a => { if (!next.hasAttribute(a.name)) target.removeAttribute(a.name); });
    Array.from(next.attributes).forEach(a => target.setAttribute(a.name, a.value));
    target.textContent = '';
    while (next.firstChild) target.appendChild(next.firstChild);
    return true;
  }

  function focusKeyOf(node) {
    for (let n = node; n && n.nodeType === 1; n = n.parentNode) {
      if (n.dataset && n.dataset.focusKey) return n.dataset.focusKey;
      if (n.id) return 'id:' + n.id;
    }
    return null;
  }
  // 키에 따옴표가 섞여도 선택자가 깨지지 않게 이스케이프한다.
  const attrValue = k => String(k).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  function focusTo(key) {
    try {
      const attr = attrValue(key.replace(/^id:/, ''));
      const node = document.querySelector(key.indexOf('id:') === 0
        ? '[id="' + attr + '"]' : '[data-focus-key="' + attr + '"]');
      if (node) node.focus({ preventScroll: true });
    } catch (err) { /* 요소가 사라졌거나 포커스를 못 걸면 처음 상태로 둔다 */ }
  }

  // 렌더마다 다시 정해지는 값. render() 안의 helper 와 보기 코드, 갱신 루프가 같이 본다.
  let data = null, L = I18N[docLang] || I18N.ko;
  let LINKS = {}, LINK_RE = /(?!)/g, KEY = '';
  let items = [], renderedAt = null, dataAt = null, viewNow = new Date();
  let RENDER = null, vst = { v: 'full', o: 'auto', chip: 'done' }, vstKey = null;
  let prevStates = null, statusSec = null, boardSec = null;
  const box = $('compact');
  const built = {};
  const saveView = () => store.set(KEY + ':view', vst);
  // 스트립 보기의 펼침은 사용자가 건드린 것을 우선하고, 아니면 가로 배치에서만 연다.
  const gOpen = (k, dflt) => (vst.g && typeof vst.g[k] === 'boolean') ? vst.g[k] : dflt;
  const relDur = v => {
    const s = Math.max(0, Math.round((viewNow.getTime() - toDate(v).getTime()) / 1000));
    return s < 60 ? L.sec(s) : fmtDur(s / 60);
  };

  // 받은 데이터로 화면 전체를 다시 그린다. 처음 로드와 15초마다의 갱신이 같은 길을 지난다.
  function render(next) {
  data = next;
  L = I18N[data.lang] || I18N.ko;
  viewNow = new Date();
  const focusKey = focusKeyOf(document.activeElement || null);
  $('countLabel').textContent = L.countDone;
  $('flow').setAttribute('aria-label', L.stepFlow);

  const hubBtn = $('hubBtn');
  if (data.hubHref) {
    hubBtn.href = data.hubHref;
    hubBtn.textContent = L.hub + ' ↗';
    hubBtn.hidden = false;
  }

  LINKS = (data.links && typeof data.links === 'object' && !Array.isArray(data.links)) ? data.links : {};
  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const KEY_PAT = Object.keys(LINKS).sort((a, b) => b.length - a.length).map(escapeRe).join('|');
  // 키는 앞뒤가 영숫자·_·- 가 아닌 경계에서만 잡는다 (SHOP-13 이 SHOP-130 안에서 걸리지 않게).
  const KEY_GROUP = KEY_PAT ? '(?<![A-Za-z0-9_-])(?:' + KEY_PAT + ')(?![A-Za-z0-9_-])' : null;
  LINK_RE = new RegExp('(' + (KEY_GROUP || '(?!)') + ')|(https?://[^\\s<>"\')\\]]+)', 'g');

  KEY = 'progress:' + (data.key || '') + ':' + (data.title || '');

  items = (data.items || []).map(it => Object.assign({}, it));
  const nextCol = {};
  items.forEach(it => {
    it.lane = Number.isFinite(it.lane) ? it.lane : 0;
    const base = nextCol[it.lane] == null ? 0 : nextCol[it.lane];
    if (it.col == null) it.col = base;
    nextCol[it.lane] = Math.max(base, it.col) + 1;
  });
  renderedAt = data.renderedAt ? toDate(data.renderedAt) : null;
  // 완료 예상의 기준은 렌더 시각이 아니라 데이터가 마지막으로 바뀐 시각이다.
  dataAt = data.dataAt ? toDate(data.dataAt) : renderedAt;

  const byState = st => items.filter(i => i.state === st);
  const doneList = byState('done'), nowList = byState('now'), blockedList = byState('blocked');
  const sideList = byState('side'), leftList = byState('left');
  const total = items.length;
  const lanes = Array.isArray(data.lanes) ? data.lanes : [];
  const laneCount = Math.max(lanes.length, items.reduce((m, i) => Math.max(m, i.lane + 1), 1));

  const edges = [];
  const perLane = {};
  items.forEach(it => { (perLane[it.lane] = perLane[it.lane] || []).push(it); });
  Object.keys(perLane).forEach(k => {
    const arr = perLane[k].slice().sort((a, b) => a.col - b.col);
    for (let i = 0; i + 1 < arr.length; i++) edges.push([arr[i].id, arr[i + 1].id]);
  });
  if (Array.isArray(data.edges)) {
    data.edges.forEach(pair => {
      if (!edges.some(e => e[0] === pair[0] && e[1] === pair[1])) edges.push(pair);
    });
  }

  // ---- 배경 ----
  const stars = $('stars');
  if (!stars.children.length) {
    for (let i = 0; i < 60; i++) {
      const st = document.createElement('b');
      st.style.left = Math.random() * 100 + '%';
      st.style.top = Math.random() * 100 + '%';
      stars.appendChild(st);
    }
  }

  // ---- 머리말 ----
  const eyebrow = $('eyebrow');
  eyebrow.hidden = false;
  if (nowList.length) $('eyebrowText').textContent = L.eyebrowNow(nowList[0].label);
  else if (blockedList.length) $('eyebrowText').textContent = L.eyebrowBlocked(blockedList[0].label);
  else if (total && doneList.length === total) $('eyebrowText').textContent = L.allDone;
  else eyebrow.hidden = true;

  swap($('h1'), h1 => {
  if (data.key) {
    const k = el('span', 'key');
    k.appendChild(data.keyHref ? linkEl(data.keyHref, document.createTextNode(data.key)) : document.createTextNode(data.key));
    h1.appendChild(k);
    h1.appendChild(document.createTextNode(' '));
  }
  h1.appendChild(el('span', 'shine', data.title || ''));
  });

  swap($('meta'), meta => {
  if (data.updated) meta.appendChild(el('span', null, L.updated(data.updated)));
  (data.meta || []).forEach(m => {
    const obj = (m && typeof m === 'object' && !Array.isArray(m)) ? m : null;
    if (obj && obj.href) {
      meta.appendChild(linkEl(obj.href, document.createTextNode(obj.text == null ? '' : String(obj.text)), 'chip mono lnk'));
      return;
    }
    const chip = el('span', 'chip mono');
    chip.appendChild(linkify(obj ? obj.text : m));
    meta.appendChild(chip);
  });
  meta.hidden = !meta.children.length;
  });

  // ---- 입력 대기 띠 (훅이 유지하는 상태) ----
  // 띠는 aria-live 라 내용이 바뀔 때만 갈아 끼운다. 훅이 없는 설치에서는 요소를 건드리지 않는다.
  if (data.live) {
    if (!statusSec) statusSec = $('status');
    swap(statusSec, band => {
    const lv = data.live;
    const stallMs = 10 * 60 * 1000;
    const lastToolAt = lv.lastTool && lv.lastTool.at ? toDate(lv.lastTool.at) : null;
    const stalled = lv.status === 'working' && lastToolAt != null
      && viewNow.getTime() - lastToolAt.getTime() > stallMs;
    band.className = 'status status-' + lv.status + (stalled ? ' status-stall' : '');
    band.hidden = false;

    const main = el('div', 'status-main');
    main.appendChild(el('i', 'status-dot'));
    let title = L.liveWorking;
    if (lv.status === 'waiting_permission') title = L.liveWait(L.forDur(relDur(lv.since)));
    else if (lv.status === 'idle') title = L.liveIdle(L.forDur(relDur(lv.since)));
    else if (lv.status === 'working' && stalled) title = L.liveStall(L.forDur(relDur(lv.lastTool.at)));
    else if (lv.status === 'ended') title = L.liveEnded(fmtClock(toDate(lv.since), viewNow));
    main.appendChild(el('b', 'status-title', title));
    const what = lv.status === 'waiting_permission' ? L.permMsg(lv.message)
      : lv.status === 'working' && lv.lastTool ? lv.lastTool.name : '';
    if (what) main.appendChild(el('span', 'status-what mono', what));
    band.appendChild(main);

    const sub = el('div', 'status-sub');
    if (lv.lastTool && lv.lastTool.name) {
      sub.appendChild(el('span', null, L.liveLastTool(lv.lastTool.name, L.ago(relDur(lv.lastTool.at)))));
    }
    const tasks = Array.isArray(lv.backgroundTasks) ? lv.backgroundTasks : [];
    if (tasks.length) {
      const first = tasks[0] && tasks[0].description;
      sub.appendChild(el('span', null, L.liveBackground(tasks.length) + (first ? ' · ' + first : '')));
    }
    const comp = lv.compactions;
    if (comp && comp.count > 0 && comp.lastAt) {
      sub.appendChild(el('span', null, L.liveCompact(comp.count, fmtClock(toDate(comp.lastAt), viewNow))));
    }
    if (sub.children.length) band.appendChild(sub);
    });
  } else if (statusSec) {
    statusSec.hidden = true;
    statusSec.textContent = '';
  }

  swap($('goal'), goal => {
  const goalRow = (tag, tagCls, text) => {
    const row = el('div', 'goal-row');
    row.appendChild(el('span', tagCls ? 'goal-tag ' + tagCls : 'goal-tag', tag));
    const p = el('p');
    p.appendChild(linkify(text));
    row.appendChild(p);
    goal.appendChild(row);
  };
  if (data.goal) goalRow(L.goal, null, data.goal);
  if (data.doneWhen) goalRow(L.doneWhen, 'end', data.doneWhen);
  goal.hidden = !goal.children.length;
  });

  // ---- 진행 바와 집계 ----
  const pct = total ? (doneList.length / total * 100) : 0;
  document.querySelector('.bar .fill').style.width = pct.toFixed(2) + '%';
  document.querySelector('.bar .tip').style.left = pct.toFixed(2) + '%';
  $('countB').textContent = doneList.length + '/' + total;

  swap($('etaCol'), col => {
  if (data.eta) {
    const rawAt = toDate(data.eta);
    const calAt = data.etaCalibrated ? toDate(data.etaCalibrated) : null;
    const etaAt = calAt || rawAt;
    const past = etaAt.getTime() < viewNow.getTime();
    const line = el('div', past ? 'eta past' : 'eta');
    line.appendChild(document.createTextNode(L.eta));
    if (calAt) line.appendChild(el('s', 'raw', fmtClock(rawAt, viewNow)));
    line.appendChild(el('b', null, fmtClock(etaAt, viewNow)));
    if (past) line.appendChild(document.createTextNode(L.overdue));
    col.appendChild(line);
    if (calAt && data.calibration) {
      const { factor, samples } = data.calibration;
      const note = factor < 1 ? L.calFast(factor, samples) : L.calSlow(factor, samples);
      col.appendChild(el('div', 'cal-note', note));
    }
  }
  });

  swap($('tally'), tally => {
  [['done', L.tally.done], ['now', L.tally.now], ['blocked', L.tally.blocked], ['side', L.tally.side], ['left', L.tally.left]].forEach(([k, t]) => {
    const c = byState(k).length;
    if (!c) return;
    const s = el('span');
    const dot = el('i');
    dot.className = k;
    s.appendChild(dot);
    s.appendChild(document.createTextNode(t + ' ' + c));
    tally.appendChild(s);
  });
  });

  // ---- 막힌 작업 ----
  swap($('blocked'), blockedWrap => {
  if (blockedList.length) {
    const h = el('h2', 'blocked');
    h.appendChild(el('span', 'ic', '⚠'));
    h.appendChild(document.createTextNode(L.secBlocked));
    blockedWrap.appendChild(h);
    blockedList.forEach(it => blockedWrap.appendChild(cardEl(it, it.state)));
  }
  });

  // ---- 흐름도 ----
  const cols = items.reduce((m, i) => Math.max(m, i.col), 0) + 1;
  const avail = $('flow').clientWidth - 32;
  const COLW = avail > 0 ? Math.max(118, Math.min(150, Math.floor(avail / cols))) : 150;
  const PADX = COLW / 2, NODE_R = 26;
  const LABEL_DY = lanes.some(name => name) ? 14 : 0;
  const NODE_DY = 62 + LABEL_DY;
  const LANEH = (items.some(it => nodeWhen(it)) ? 184 : 150) + LABEL_DY;
  const canvasEl = $('canvas');
  const pos = {};
  // 캔버스를 비우면 폭이 0 이 되어 스크롤이 처음으로 가므로 위치를 받아 두었다가 되돌린다.
  const keepScroll = prevStates == null ? store.get(KEY + ':scroll') : flow.scrollLeft;

  swap(canvasEl, canvas => {
  Array.from({ length: laneCount }, (_, i) => lanes[i] || '').forEach((name, i) => {
    const inLane = items.filter(it => it.lane === i);
    const cls = inLane.some(it => it.state === 'blocked') ? 'blocked'
      : inLane.some(it => it.state === 'now') ? 'live'
      : (inLane.length && inLane.every(it => it.state === 'done')) ? 'done' : '';
    const band = el('div', 'lane-band' + (cls ? ' ' + cls : ''));
    band.style.top = (i * LANEH + 4) + 'px';
    band.style.height = (LANEH - 8) + 'px';
    if (name) band.appendChild(el('span', 'lane-label', name));
    canvas.appendChild(band);
  });

  const W = PADX * 2 + (cols - 1) * COLW;
  const H = laneCount * LANEH;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  items.forEach(it => { pos[it.id] = { x: PADX + it.col * COLW, y: it.lane * LANEH + NODE_DY }; });

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'edges');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  edges.forEach((pair, index) => {
    const p = pos[pair[0]], q = pos[pair[1]];
    if (!p || !q) return;
    const x1 = p.x + NODE_R + 4, x2 = q.x - NODE_R - 4, y1 = p.y, y2 = q.y;
    const a = items.find(i => i.id === pair[0]), b = items.find(i => i.id === pair[1]);
    const gx = q.x - COLW / 2;
    const blocked = items.some(it => it.lane === a.lane && it.col > a.col && it.col < b.col);
    let d;
    if (y1 === y2) d = `M${x1} ${y1} L${x2} ${y2}`;
    else if (b.col - a.col >= 2 && !blocked) {
      const w = 22;
      d = `M${x1} ${y1} L${gx - w} ${y1} C${gx} ${y1}, ${gx} ${y2}, ${gx + w} ${y2} L${x2} ${y2}`;
    } else {
      const mx = (x1 + x2) / 2;
      d = `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
    }
    const from = a.state;
    const to = b.state;
    const cls = (from === 'blocked' || to === 'blocked') ? 'blocked'
      : (from === 'done' && to === 'done') ? 'done'
      : (from === 'done' && to === 'now') ? 'active'
      : (from === 'side' || to === 'side') ? 'side' : 'left';
    const delay = (-(index * 0.37) % 1.8).toFixed(2) + 's';
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge ' + cls);
    path.style.animationDelay = delay;
    svg.appendChild(path);
    if (cls === 'done') {
      const flow = document.createElementNS(NS, 'path');
      flow.setAttribute('d', d);
      flow.setAttribute('class', 'edge-flow');
      flow.style.animationDelay = delay;
      svg.appendChild(flow);
    }
  });
  canvas.appendChild(svg);

  let doneIndex = 0;
  items.forEach(it => {
    const node = el('div', 'fnode ' + it.state);
    node.dataset.id = it.id;
    node.style.left = pos[it.id].x + 'px';
    node.style.top = pos[it.id].y + 'px';
    node.style.width = (COLW - 16) + 'px';
    const circle = el('div', 'node', NODE_ICON[it.state] || '○');
    if (it.state === 'now') circle.appendChild(el('i', 'orbit'));
    node.appendChild(circle);
    if (it.state === 'done') node.style.setProperty('--i', doneIndex++);
    node.appendChild(el('div', 'label', it.label));
    node.appendChild(el('div', 'sub', it.sub || ''));
    const when = nodeWhen(it);
    if (when) node.appendChild(el('div', when.pending ? 'when when-now' + (when.past ? ' when-past' : '') : 'when', when.text));
    canvas.appendChild(node);
  });
  });
  if (typeof keepScroll === 'number') flow.scrollLeft = keepScroll;

  // ---- 카드 ----
  swap($('cards'), cards => {
  function section(headCls, glyph, title, list, cardCls) {
    const h = el('h2', headCls);
    h.appendChild(el('span', 'ic', glyph));
    h.appendChild(document.createTextNode(title));
    cards.appendChild(h);
    list.forEach(it => cards.appendChild(cardEl(it, cardCls(it))));
  }
  if (nowList.length) section('now', '▶', L.secNow, nowList, () => 'now');
  if (doneList.length) section('done', '✓', L.secDone, doneList, () => 'done');
  const rest = sideList.concat(leftList);
  if (rest.length) section('left', '○', L.secRemaining, rest, it => it.state === 'side' ? 'left side' : 'left');
  if (Array.isArray(data.changes) && data.changes.length) {
    const h = el('h2', 'left');
    h.appendChild(el('span', 'ic', 'Δ'));
    h.appendChild(document.createTextNode(L.secChanges));
    cards.appendChild(h);
    data.changes.forEach(c => {
      const card = el('div', 'card');
      if (c.title) {
        const h3 = el('h3');
        h3.appendChild(linkify(c.title));
        card.appendChild(h3);
      }
      if (c.body) {
        const p = el('p');
        p.appendChild(linkify(c.body));
        card.appendChild(p);
      }
      if (Array.isArray(c.evidence) && c.evidence.length) card.appendChild(evEl(c.evidence));
      cards.appendChild(card);
    });
  }
  });

  swap($('footer'), footer => {
  if (data.footer) footer.appendChild(linkify(data.footer));
  footer.hidden = !data.footer;
  });

  // ---- 레인 보드 ----
  // 정체 판정은 여기서 한다. 페이지는 15초마다 다시 그려지므로 모델이 갱신을 멈춰도
  // 마지막 신호가 stallAfter 를 넘긴 now 레인은 정체로 드러난다.
  let restoreBoardScroll = () => {};
  if (data.board && Array.isArray(data.board.lanes) && data.board.lanes.length) {
    if (!boardSec) boardSec = $('board');
    const board = data.board;
    const bdLanes = board.lanes;
    const bdStages = Array.isArray(board.stages) && board.stages.length ? board.stages : null;
    const STALL_DEFAULT = 10;
    const bdStateKey = KEY + ':board';
    const bdSaved = store.get(bdStateKey);
    const bdState = (bdSaved && typeof bdSaved === 'object' && !Array.isArray(bdSaved)) ? bdSaved : {};
    const bdSave = () => store.set(bdStateKey, bdState);
    // 가로 스크롤은 200ms 늦게 저장되므로 다시 그리기 직전의 위치를 먼저 받아 둔다.
    const liveScroll = boardSec.querySelector('.bd-scroll');
    if (liveScroll) bdState.scrollLeft = liveScroll.scrollLeft;
    const bdOpen = new Set(Array.isArray(bdState.open) ? bdState.open : []);
    const laneSignalAt = lane => {
      const raw = lane.lastSignal || lane.startedAt;
      return raw ? toDate(raw) : null;
    };
    const laneStallAfter = lane => (typeof lane.stallAfter === 'number' && lane.stallAfter > 0)
      ? lane.stallAfter : STALL_DEFAULT;
    const laneStalled = lane => {
      if (lane.state !== 'now') return false;
      const sig = laneSignalAt(lane);
      return sig != null && viewNow.getTime() - sig.getTime() > laneStallAfter(lane) * 60000;
    };
    const bdDone = bdLanes.filter(l => l.state === 'done');
    const bdBlocked = bdLanes.filter(l => l.state === 'blocked');
    const bdWaiting = bdLanes.filter(l => l.state === 'waiting');
    const bdLeft = bdLanes.filter(l => l.state === 'left');
    const bdStall = bdLanes.filter(laneStalled);
    const bdActive = bdLanes.filter(l => l.state === 'now' && !laneStalled(l));
    const bdAttention = bdLanes.filter(l => laneStalled(l) || l.state === 'blocked');

    const cellClass = lane => laneStalled(lane) ? 'stall' : lane.state;
    const barClass = lane => laneStalled(lane) ? 'stall'
      : lane.state === 'done' ? 'done'
      : lane.state === 'now' ? 'now'
      : lane.state === 'blocked' ? 'blocked' : 'blank';
    // 펼침 요소는 키보드로도 눌러야 한다. Enter 와 Space 를 클릭과 같이 다루고
    // Space 가 페이지를 스크롤하지 않게 막는다.
    const keyActivate = (node, action) => node.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      e.preventDefault();
      action();
    });

    // 컴팩트 보기에서도 이 섹션만 남겨 보이게 하는 표시 (template 의 [data-board] 규칙)
    body.dataset.board = '';
    const boardChanged = swap(boardSec, sec => {
    sec.hidden = false;
    sec.setAttribute('aria-label', L.boardTitle);

    const sum = el('div', 'bd-sum');
    const big = el('div', 'bd-big', bdDone.length + ' / ' + bdLanes.length);
    big.appendChild(el('small', null, L.boardDone));
    sum.appendChild(big);
    const stack = el('div', 'bd-stack');
    const legend = el('div', 'bd-legend');
    [['done', bdDone.length, L.boardDone], ['now', bdActive.length, L.boardRunning],
      ['stall', bdStall.length, L.boardStalled], ['blocked', bdBlocked.length, L.boardBlocked],
      ['waiting', bdWaiting.length, L.boardWaiting], ['left', bdLeft.length, L.boardLeft]
    ].forEach(([cls, count, label]) => {
      if (!count) return;
      const seg = el('i', cls);
      seg.style.width = (count / bdLanes.length * 100).toFixed(2) + '%';
      stack.appendChild(seg);
      const item = el('span');
      item.appendChild(el('i', cls));
      item.appendChild(document.createTextNode(label + ' ' + count));
      legend.appendChild(item);
    });
    sum.appendChild(stack);
    sum.appendChild(legend);
    sec.appendChild(sum);

    if (bdAttention.length) {
      const attn = el('div', 'bd-attn');
      bdAttention.forEach(lane => {
        const isStall = laneStalled(lane);
        const row = el('div', 'bd-attn-row ' + (isStall ? 'stall' : 'blocked'));
        const sig = laneSignalAt(lane);
        const mins = isStall && sig ? Math.round((viewNow.getTime() - sig.getTime()) / 60000) : 0;
        row.appendChild(el('span', 'bd-tag', isStall ? L.boardTagStall(fmtDur(mins)) : L.boardTagBlocked));
        const key = el('span', 'bd-k');
        key.appendChild(linkify(lane.id));
        row.appendChild(key);
        const why = el('span', 'bd-why');
        why.appendChild(linkify((lane.label == null ? '' : String(lane.label))
          + (lane.body ? ' · ' + lane.body : '')));
        row.appendChild(why);
        attn.appendChild(row);
      });
      sec.appendChild(attn);
    }

    const tabs = el('div', 'bd-tabs');
    const tabStage = el('button', 'bd-tab', L.boardTabStages);
    const tabTime = el('button', 'bd-tab', L.boardTabTime);
    [tabStage, tabTime].forEach((tab, i) => {
      tab.type = 'button';
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', i ? 'false' : 'true');
      tab.dataset.focusKey = 'tab:' + (i ? 'time' : 'stage');
    });
    tabs.setAttribute('role', 'tablist');
    const stagePanel = el('div', 'bd-panel');
    const timePanel = el('div', 'bd-panel');
    const selectTab = (time, remember) => {
      tabStage.setAttribute('aria-selected', time ? 'false' : 'true');
      tabTime.setAttribute('aria-selected', time ? 'true' : 'false');
      stagePanel.hidden = time;
      timePanel.hidden = !time;
      if (remember) { bdState.tab = time ? 'time' : 'stage'; bdSave(); }
    };
    tabStage.addEventListener('click', () => { selectTab(false, true); restoreBdScroll(); });
    tabTime.addEventListener('click', () => selectTab(true, true));
    selectTab(bdState.tab === 'time', false);
    tabs.appendChild(tabStage);
    tabs.appendChild(tabTime);
    sec.appendChild(tabs);
    sec.appendChild(stagePanel);
    sec.appendChild(timePanel);

    function laneDetail(lane) {
      const detail = el('div', 'bd-detail');
      const nowSec = el('div');
      nowSec.appendChild(el('h4', null, L.boardDetailNow));
      if (lane.body) {
        const p = el('p');
        p.appendChild(linkify(String(lane.body)));
        nowSec.appendChild(p);
      } else {
        nowSec.appendChild(el('p', null, '—'));
      }
      if (Array.isArray(lane.evidence) && lane.evidence.length) nowSec.appendChild(evEl(lane.evidence));
      detail.appendChild(nowSec);
      const logSec = el('div');
      logSec.appendChild(el('h4', null, L.boardLogTitle));
      const logs = (Array.isArray(lane.log) ? lane.log.slice() : [])
        .filter(entry => entry && entry.at)
        .sort((a, b) => toDate(b.at) - toDate(a.at));
      if (logs.length) {
        const list = el('ul', 'bd-log');
        logs.forEach(entry => {
          const li = el('li');
          li.appendChild(el('time', null, fmtClock(toDate(entry.at), viewNow)));
          const text = el('span');
          text.appendChild(linkify(entry.text == null ? '' : String(entry.text)));
          li.appendChild(text);
          list.appendChild(li);
        });
        logSec.appendChild(list);
      } else {
        logSec.appendChild(el('p', null, L.boardNoLog));
      }
      detail.appendChild(logSec);
      return detail;
    }

    function laneRow(lane) {
      const row = el('div', 'bd-row');
      row.dataset.lane = lane.id;
      row.setAttribute('tabindex', '0');
      row.setAttribute('role', 'button');
      const task = el('div', 'bd-task');
      const t1 = el('div', 'bd-t1');
      const key = el('span', 'bd-k');
      key.appendChild(linkify(lane.id));
      t1.appendChild(key);
      const name = el('span', 'bd-nm');
      name.appendChild(linkify(lane.label == null ? '' : String(lane.label)));
      t1.appendChild(name);
      task.appendChild(t1);
      const t2 = el('div', 'bd-t2');
      t2.appendChild(el('span', 'bd-wk', lane.worker ? String(lane.worker) : L.boardUnassigned));
      if (Array.isArray(lane.dependsOn) && lane.dependsOn.length) {
        t2.appendChild(el('span', 'bd-dep', L.boardDepends(lane.dependsOn.join(' · '))));
      }
      task.appendChild(t2);
      row.appendChild(task);

      const cur = bdStages ? bdStages.indexOf(lane.stage) : -1;
      if (bdStages) {
        bdStages.forEach((name2, i) => {
          const cls = (lane.state === 'done' || (cur >= 0 && i < cur)) ? 'done'
            : (i === cur) ? cellClass(lane) : 'pending';
          const cell = el('div', 'bd-cell ' + cls);
          cell.appendChild(el('span', 'bd-dot'));
          if (i === cur && lane.note) cell.appendChild(el('span', 'bd-note', String(lane.note)));
          row.appendChild(cell);
        });
      } else {
        const cell = el('div', 'bd-cell');
        cell.appendChild(el('span', 'bd-cell-text', lane.stage ? String(lane.stage) : '—'));
        row.appendChild(cell);
      }

      const sig = el('div', 'bd-sig');
      const at = laneSignalAt(lane);
      if (at) sig.appendChild(el('span', 'bd-ago' + (laneStalled(lane) ? ' stall' : ''), L.ago(relDur(at))));
      else if (lane.state === 'now') sig.appendChild(el('span', 'bd-ago none', L.boardSignalNone));
      if (lane.state !== 'done' && typeof lane.estimate === 'number') {
        sig.appendChild(el('span', 'bd-eta', L.boardEtaLeft(fmtDur(lane.estimate))));
      }
      row.appendChild(sig);
      return row;
    }

    const bdScroll = el('div', 'bd-scroll');
    let bdScrollTimer = null;
    bdScroll.addEventListener('scroll', () => {
      clearTimeout(bdScrollTimer);
      bdScrollTimer = setTimeout(() => { bdState.scrollLeft = bdScroll.scrollLeft; bdSave(); }, 200);
    });
    // 문서에 붙기 전이나 숨은 패널에 넣은 값은 무시되므로 배치가 끝난 뒤에만 되돌린다.
    const restoreBdScroll = () => {
      if (typeof bdState.scrollLeft !== 'number' || stagePanel.hidden) return;
      bdScroll.scrollLeft = bdState.scrollLeft;
    };
    const grid = el('div', 'bd-grid');
    grid.style.setProperty('--bd-stages', String(bdStages ? bdStages.length : 1));
    const head = el('div', 'bd-row bd-head');
    head.appendChild(el('div', null, L.boardTask));
    (bdStages || [L.boardStage]).forEach(name => head.appendChild(el('div', 'bd-st', name)));
    head.appendChild(el('div', 'bd-sig', L.boardLast));
    grid.appendChild(head);

    const bdGroupClosed = key => {
      const saved = bdState.closed;
      return (saved && typeof saved === 'object' && !Array.isArray(saved) && typeof saved[key] === 'boolean')
        ? saved[key] : key === 'finished';
    };
    const bdSetGroupClosed = (key, closed) => {
      if (!bdState.closed || typeof bdState.closed !== 'object' || Array.isArray(bdState.closed)) bdState.closed = {};
      bdState.closed[key] = closed;
      bdSave();
    };
    const groupHead = (label, key, list) => {

        const detail = laneDetail(lane);

          detail.classList.toggle('open');

    groupHead(L.boardGroupActive, 'active', bdActive);

    } else {

      const span = Math.max(1, t1 - t0);

      axis.appendChild(ticks);
      timeline.appendChild(axis);
      const byWorker = new Map();
      stamped.forEach(lane => {
        const worker = (typeof lane.worker === 'string' && lane.worker) ? lane.worker : L.boardUnassigned;

        const laneEnds = [];
        list.slice().sort((a, b) => toDate(a.startedAt) - toDate(b.startedAt)).forEach(lane => {
          const start = toDate(lane.startedAt).getTime();
          const end = lane.doneAt ? Math.min(t1, toDate(lane.doneAt).getTime()) : t1;
          let sub = laneEnds.findIndex(prev => prev <= start);
          if (sub < 0) { sub = laneEnds.length; laneEnds.push(0); }
          laneEnds[sub] = end;
          const bar = el('div', 'bd-bar ' + barClass(lane), lane.id);
          bar.style.left = pos(start).toFixed(2) + '%';
          bar.style.width = Math.max(0.8, pos(end) - pos(start)).toFixed(2) + '%';
          bar.style.top = (9 + sub * 30) + 'px';
          track.appendChild(bar);
        });
        track.style.height = (18 + laneEnds.length * 30) + 'px';
        const nowLine = el('div', 'bd-nowline');

  function cardEl(it, cls) {
    const card = el('div', cls ? 'card ' + cls : 'card');

    if ((Array.isArray(it.stats) && it.stats.length) || (Array.isArray(it.compare) && it.compare.length)) card.appendChild(vizEl(it));

  function nodeWhen(it) {
    const start = it.startedAt ? toDate(it.startedAt) : null;
    if (it.state === 'done' && start && it.doneAt) {
      return { text: fmtDur((toDate(it.doneAt).getTime() - start.getTime()) / 60000) };
    }
    if (it.state === 'now' && typeof it.estimate === 'number' && dataAt) {
      const end = plusMinutes(dataAt, it.estimate);
      const past = end.getTime() < viewNow.getTime();
      return { text: '~' + fmtClock(end, viewNow) + (past ? L.overdue : ''), pending: true, past: past };
    }
    if ((it.state === 'left' || it.state === 'side') && typeof it.estimate === 'number') {
      return { text: '~' + fmtDur(it.estimate) };
    }
    return null;
  }

  function nowTimeEl(it) {
    if (it.state !== 'now' || !it.startedAt || typeof it.estimate !== 'number' || !dataAt) return null;
    const start = toDate(it.startedAt);
    const end = plusMinutes(dataAt, it.estimate);
    const elapsed = viewNow.getTime() - start.getTime();
    const total = end.getTime() - start.getTime();
    const ratio = total > 0 ? Math.min(1, Math.max(0, elapsed / total)) : 0;
    const wrap = el('div', 'etime');
    const top = el('div', 'etime-row');
    top.appendChild(el('span', null, L.started + fmtClock(start, viewNow)));
    top.appendChild(el('span', null, L.eta + fmtClock(end, viewNow) + (end.getTime() < viewNow.getTime() ? L.overdue : '')));
    wrap.appendChild(top);
    const bar = el('div', 'etime-bar');
    const fill = el('i');
    fill.style.width = (ratio * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    wrap.appendChild(bar);
    const bottom = el('div', 'etime-row');
    bottom.appendChild(el('span', null, L.elapsed + fmtDur(Math.max(0, elapsed / 60000))));
    bottom.appendChild(el('span'));
    wrap.appendChild(bottom);

        wrap.appendChild(el('div', lc));

    return wrap;

  function vizEl(it) {

  function statEl(st) {
    const wrap = el('div', 'stat');
    const value = st.value == null ? '' : String(st.value);
    if (st.kind === 'ring') {
      const totalN = Number(st.total) || 0;
      const ratio = totalN > 0 ? Math.min(1, Math.max(0, (Number(st.value) || 0) / totalN)) : 0;
      const off = (113.1 * (1 - ratio)).toFixed(1);
      const ring = document.createElementNS(NS, 'svg');
      ring.setAttribute('class', 'ring');
      ring.setAttribute('viewBox', '0 0 46 46');
      ['bg', 'fg'].forEach(k => {

        c.setAttribute('class', k);
        c.setAttribute('cx', '23'); c.setAttribute('cy', '23'); c.setAttribute('r', '18');

  // ---- 완료 효과 ----

    const fr = canvasEl.getBoundingClientRect(), r = node.getBoundingClientRect();
    const sp = el('span', 'spark');
    const size = 8 + Math.random() * 10;
    sp.style.width = sp.style.height = size + 'px';

    sp.style.top = (r.top - fr.top + Math.random() * r.height - size / 2) + 'px';
    canvasEl.appendChild(sp);
    sp.addEventListener('animationend', () => sp.remove());
  }

  function burstAt(node) {
    const fr = canvasEl.getBoundingClientRect(), r = node.getBoundingClientRect();
    const cx = r.left - fr.left + r.width / 2, cy = r.top - fr.top + r.height / 2;
    const colors = ['#34d399', '#a7f3d0', '#fbbf24', '#fff', '#c4b5fd'];
    for (let i = 0; i < 28; i++) {
      const p = el('span', 'burst');
      const a = (Math.PI * 2 * i) / 28 + Math.random() * .3;
      const dist = 40 + Math.random() * 60;
      p.style.left = (cx - 4) + 'px';
      p.style.top = (cy - 4) + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(a) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(a) * dist + 'px');
      canvasEl.appendChild(p);
      p.addEventListener('animationend', () => p.remove());

            </div>
            <div class="cc-seg" aria-label="${esc(L.statesLabel)}">${items.map(i => `<span class="${i.state}" title="${esc(i.label)}"></span>`).join('')}</div>
            <div class="cc-legend">${counts.map(([k, l, a]) => `<span><i class="cx-dot ${k}"></i>${l} ${a.length}</span>`).join('')}</div>
          </div>
          <div>${nowCard()}
            <div class="cc-chips" role="group" aria-label="${esc(L.stepListLabel)}">${chips.map(([k, l, a]) => `<button type="button" id="cc-${k}" data-k="${k}" aria-pressed="${vst.chip === k}"><i class="cx-dot ${k}"></i>${l} ${a.length}</button>`).join('')}</div>
            <ul class="cc-list">${(counts.find(c => c[0] === vst.chip) || chips[0] || [, , []])[2].map(i => `<li><i class="cx-dot ${i.state}"></i><span>${esc(i.title)}</span><span>${i.doneAt ? fmtClock(toDate(i.doneAt), viewNow) : (i.estimate != null ? fmtDur(i.estimate) : '')}</span></li>`).join('')}</ul>
          </div>
        </div>`;
    }
  };

  apply();

  // 다시 그리면서 포커스가 있던 요소가 사라졌으면 같은 키의 새 요소로 되돌린다.
  if (focusKey && (!document.activeElement || document.activeElement === body)) focusTo(focusKey);
  }
  // ---- render() 끝 ----

  // 가로·세로는 창 비율로 정하고, 버튼으로 고정할 수 있다
  const landMq = matchMedia('(min-aspect-ratio: 5/4) and (min-width: 760px)');
  function apply() {
    document.body.dataset.view = vst.v;
    ['full', 'a', 'b', 'c'].forEach(v => { const b = $('v-' + v); if (b) b.setAttribute('aria-pressed', String(v === vst.v)); });
    ['auto', 'land', 'port'].forEach(o => { const b = $('o-' + o); if (b) b.setAttribute('aria-pressed', String(o === vst.o)); });
    if (vst.v === 'full' || !RENDER) { box.hidden = true; delete $('viewbar').dataset.o; return; }
    vst.oe = vst.o === 'auto' ? (landMq.matches ? 'land' : 'port') : vst.o;
    box.dataset.o = vst.oe;
    $('viewbar').dataset.o = vst.oe;
    // 같은 문자열이면 다시 넣지 않는다. 넣으면 펼침과 선택이 풀린다.
    const html = RENDER[vst.v]();
    if (html !== built.html) { box.innerHTML = html; built.html = html; }
    box.hidden = false;
  }
  $('views').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; vst.v = b.dataset.v; saveView(); apply(); scrollTo(0, 0); });
  $('orient').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; vst.o = b.dataset.o; saveView(); apply(); });
  box.addEventListener('click', e => { const b = e.target.closest('.cc-chips button'); if (!b) return; vst.chip = b.dataset.k; saveView(); apply(); });
  // toggle 은 버블링하지 않으므로 캡처 단계에서 받는다. 사용자가 펼치거나 접은 것을 기억해 다시 그려도 유지한다.
  box.addEventListener('toggle', e => {
    const d = e.target;
    if (!d || !d.dataset || !d.dataset.g) return;
    vst.g = Object.assign({}, vst.g || {});
    vst.g[d.dataset.g] = !!d.open;
    saveView();
  }, true);
  landMq.addEventListener('change', () => { if (vst.o === 'auto') apply(); });

  const flow = $('flow');
  let scrollTimer = null;
  flow.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => store.set(KEY + ':scroll', flow.scrollLeft), 200);
  });

  // ---- 키보드 포커스 복원 ----
  // 재로드(file:// 경로, 템플릿 교체)로 새로 그려지면 포커스가 문서 처음으로 돌아간다. 포커스된 요소의
  // 안정적인 키를 남겨 두고, 렌더가 끝난 뒤 방금 남긴 기록이면 그 요소로 되돌린다.
  const FOCUS_TTL_MS = 30 * 1000;
  document.addEventListener('focusin', e => {
    const key = focusKeyOf(e.target);
    if (key) store.set(KEY + ':focus', { key: key, at: Date.now() });
  });

  // ---- 첫 그리기 ----
  let initial = null;
  try {
    initial = parseData($('progress-data').textContent);
  } catch (err) {
    console.error('progress: 데이터를 읽지 못했다', err);
    showNotice(L.loadFail);
  }
  if (initial) {
    render(initial);
    const focusRec = store.get(KEY + ':focus');
    if (focusRec && typeof focusRec.key === 'string' && typeof focusRec.at === 'number'
        && Date.now() - focusRec.at <= FOCUS_TTL_MS) focusTo(focusRec.key);
  }

  // ---- 자동 갱신 ----
  // 문서를 다시 로드하지 않고 같은 주소의 HTML 을 받아 데이터 블록만 꺼내 다시 그린다. 그래야 펼친 상태·스크롤·
  // 포커스가 남고 aria-live 띠가 바뀐 부분만 읽는다. 그렇게 할 수 있는 것은 serve.py 가 http 로 준 페이지뿐이다.
  // file:// 는 fetch 가 막히므로 예전처럼 재로드하고, 공유된 사본(Orca·Claude 아티팩트)은 갱신하지 않는다.
  const loc = typeof location === 'object' && location ? location : null;
  const LOOPBACK = ['127.0.0.1', 'localhost', '[::1]'];
  const refreshMode = !loc ? 'static'
    : (loc.protocol === 'http:' || loc.protocol === 'https:') && LOOPBACK.includes(loc.hostname) ? 'fetch'
    : loc.protocol === 'file:' ? 'reload' : 'static';
  let lastOkAt = Date.now();
  let timer = null, inflight = false;
  const schedule = () => { timer = setTimeout(() => { timer = null; tick(); }, REFRESH_MS); };
  const applyPage = html => {
    const block = DATA_RE.exec(html);
    if (!block) throw new Error('데이터 블록이 없다');
    // 코드 블록은 데이터 블록 뒤에서 찾는다. 데이터 본문에 script 태그 글자가 있으면 그 안에서 먼저 걸린다.
    const code = CODE_RE.exec(html.slice(block.index + block[0].length));
    // 템플릿(스킬)이 바뀌었으면 새 코드가 돌게 재로드한다. 보기 상태는 sessionStorage 에 남아 있다.
    if (ownCode != null && code && code[1] !== ownCode) { loc.reload(); return false; }
    render(parseData(block[1]));
    return true;
  };
  const tick = () => {
    // 안 보이는 탭은 받지 않는다. 보이게 되면 visibilitychange 가 바로 부른다.
    if (document.hidden) return;
    inflight = true;
    body.classList.add('no-entrance');
    fetch(loc.href.split('#')[0], { cache: 'no-store', credentials: 'same-origin' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(html => { if (applyPage(html)) { lastOkAt = Date.now(); hideNotice(); } })
      .catch(err => {
        console.error('progress: 최신 상태를 받지 못했다', err);
        // 마지막으로 받은 데이터로 상대 시각만이라도 흐르게 한다.
        try { if (data) render(data); } catch (e) { /* 그려지지 않는 데이터면 화면은 그대로 둔다 */ }
        showNotice(L.refreshFail(L.forDur(relDur(lastOkAt))));
      })
      .then(() => { inflight = false; schedule(); });
  };
  if (refreshMode === 'fetch') {
    schedule();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !timer && !inflight) tick();
    });
  } else if (refreshMode === 'reload') {
    setTimeout(() => loc.reload(), REFRESH_MS);
  }
})();
</script>
</body>
</html>
